<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7가지 무지개 질문 돌림판</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            text-align: center;
        }

        p.sub-title {
            color: #94a3b8;
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.95rem;
        }

        .wheel-container {
            position: relative;
            width: 360px;
            height: 360px;
            margin-bottom: 25px;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .arrow-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
        }

        .arrow-svg {
            width: 270px;
            height: 270px;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5));
        }

        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 22px;
            height: 22px;
            background-color: #ffffff;
            border: 4px solid #1e293b;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .spin-btn {
            background-color: #facc15;
            color: #000000;
            font-size: 1.25rem;
            font-weight: 800;
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(250, 204, 21, 0.5);
            transition: transform 0.1s, background-color 0.2s;
            margin-bottom: 20px;
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        .spin-btn:disabled {
            background-color: #475569;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        .result-box {
            background-color: #1e293b;
            border: 2px solid #334155;
            padding: 16px 24px;
            border-radius: 16px;
            text-align: center;
            width: 100%;
            max-width: 380px;
            min-height: 85px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #facc15;
        }

        .result-desc {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>🎯 7가지 질문 돌림판</h1>
    <p class="sub-title">버튼을 누르면 화살표가 돌아가 질문을 선택합니다!</p>

    <div class="wheel-container">
        <canvas id="wheelCanvas" width="800" height="800"></canvas>

        <div class="arrow-wrapper" id="arrowWrapper">
            <svg class="arrow-svg" viewBox="0 0 100 100">
                <polygon points="50,46 88,46 88,38 98,50 88,62 88,54 50,54" fill="#facc15" stroke="#ffffff" stroke-width="2"/>
            </svg>
        </div>

        <div class="center-dot"></div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spinArrow()">여기를 눌러주세요</button>

    <div class="result-box">
        <div class="result-title" id="resultTitle" style="color: #94a3b8;">버튼을 눌러 화살표를 돌려주세요!</div>
        <div class="result-desc" id="resultDesc"></div>
    </div>

    <script>
        const questions = [
            { label: "1. 사실확인", name: "1. 사실 확인 질문", desc: "예: 무슨 일이 있었나요? 어떤 일이 일어났나요?" },
            { label: "2. 느낌묻기", name: "2. 느낌을 묻는 질문", desc: "예: 그 순간 기분이 어땠나요? 어떤 마음이 들었나요?" },
            { label: "3. 원인묻기", name: "3. 원인을 묻는 질문", desc: "예: 왜 그런 일이 생겼을까요? 어떤 이유 때문일까요?" },
            { label: "4. 의견묻기", name: "4. 의견을 묻는 질문", desc: "예: 이에 대해 어떻게 생각하나요? 본인의 의견은?" },
            { label: "5. 해결방법", name: "5. 문제 해결방법 질문", desc: "예: 앞으로 어떻게 해결하면 좋을까요?" },
            { label: "6. 가정하기", name: "6. 가정하여 묻기", desc: "예: 만약 ~라면 어땠을까요? 다른 상황이었다면?" },
            { label: "7. 자유질문", name: "7. 자유 질문", desc: "예: 원하는 질문을 자유롭게 하나 해보세요!" }
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numSlices = questions.length;
        const sliceAngle = (2 * Math.PI) / numSlices;

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSlices; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = "#1e293b";
                ctx.fill();

                ctx.lineWidth = 4;
                ctx.strokeStyle = "#475569";
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                const midAngle = startAngle + sliceAngle / 2;
                ctx.rotate(midAngle);

                ctx.fillStyle = "#f8fafc";
                ctx.font = "bold 32px Pretendard, sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                if (midAngle > Math.PI / 2 && midAngle < (3 * Math.PI) / 2) {
                    ctx.translate(radius * 0.65, 0);
                    ctx.rotate(Math.PI);
                    ctx.fillText(questions[i].label, 0, 0);
                } else {
                    ctx.fillText(questions[i].label, radius * 0.65, 0);
                }

                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#facc15";
            ctx.stroke();
        }

        drawWheel();

        let currentRotation = 0;
        const arrowWrapper = document.getElementById('arrowWrapper');
        const spinBtn = document.getElementById('spinBtn');
        const resultTitle = document.getElementById('resultTitle');
        const resultDesc = document.getElementById('resultDesc');

        function spinArrow() {
            spinBtn.disabled = true;
            resultTitle.style.color = "#94a3b8";
            resultTitle.textContent = "화살표가 돌아가는 중...";
            resultDesc.textContent = "";

            const randomDegree = Math.floor(Math.random() * 360);
            const totalSpin = 1800 + randomDegree;
            currentRotation += totalSpin;

            arrowWrapper.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                const normalizedDegree = currentRotation % 360;
                const sliceDegree = 360 / numSlices;

                const selectedIndex = Math.floor(normalizedDegree / sliceDegree);
                const selected = questions[selectedIndex];

                resultTitle.style.color = "#facc15";
                resultTitle.textContent = selected.name;
                resultDesc.textContent = selected.desc;

                spinBtn.disabled = false;
            }, 4000);
        }
    </script>
</body>
</html>
