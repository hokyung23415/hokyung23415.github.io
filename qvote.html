<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>좋은 질문 찾기</title>
<style>
:root{
  --bg:#fbf7ee; --ink:#22303f; --soft:#6b7684; --line:#e6dfcf; --card:#fff;
  --navy:#1f3b63; --yellow:#ffc845; --yellow-d:#e8a100; --green:#2fb36d; --green-l:#e3f6ec;
  --blue:#3d7be0; --blue-l:#e6efff; --purple:#7b5cd6; --purple-l:#efeafd; --orange:#f08c2e; --orange-l:#fff1e2;
  --red:#e0524d; --gray-l:#eef0f3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:700;transition:transform .08s, filter .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea{font:inherit;color:inherit}
.btn-main{background:var(--navy);color:#fff}
.btn-yellow{background:var(--yellow);color:var(--navy)}
.btn-green{background:var(--green);color:#fff}
.btn-ghost{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn-red{background:#fff;color:var(--red);border:2px solid #f3c9c7}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
.twrap{max-width:1280px;margin:0 auto;padding:18px 24px 60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy)}
.brand .q{width:38px;height:38px;border-radius:12px;background:var(--yellow);display:grid;place-items:center;font-size:22px;color:var(--navy)}
h1{font-size:26px;color:var(--navy);line-height:1.3}
h2{font-size:20px;color:var(--navy)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
.muted{color:var(--soft)}
.small{font-size:14px}
.field{display:block;margin:14px 0}
.field span{display:block;font-weight:700;margin-bottom:6px;color:var(--navy)}
.field input,.field textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;background:#fff;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--blue)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.conn{position:fixed;right:10px;bottom:10px;font-size:12px;padding:5px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--soft);z-index:50}
.conn.bad{color:var(--red);border-color:#f3c9c7}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:90vw;text-align:center}
/* criteria */
.crit-list{list-style:none;display:grid;gap:8px}
.crit-list li{display:flex;gap:10px;align-items:flex-start;background:var(--orange-l);border-radius:12px;padding:10px 12px;font-weight:700;color:#7a4a12;line-height:1.4}
.crit-list li b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:13px}
.crit-edit{display:flex;gap:8px;margin:8px 0}
.crit-edit input{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
.crit-edit button{padding:8px 12px;background:#fff;border:2px solid var(--line);color:var(--soft)}
/* teacher dashboard */
.tgrid{display:grid;grid-template-columns:320px 1fr;gap:20px;margin-top:16px}
@media (max-width:900px){.tgrid{grid-template-columns:1fr}}
.qrbox{text-align:center}
.qrbox canvas{width:100%;max-width:260px;height:auto;image-rendering:pixelated;border-radius:12px;background:#fff}
.code{font-size:34px;font-weight:900;letter-spacing:6px;color:var(--navy)}
.link{word-break:break-all;font-size:13px;color:var(--soft);margin-top:6px}
.stats{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bigcount{font-size:30px;font-weight:900;color:var(--navy)}
.bar{height:12px;background:var(--gray-l);border-radius:999px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .4s}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.scard{position:relative;border-radius:16px;padding:12px 12px 10px;background:var(--gray-l);border:3px solid transparent;transition:background .35s,border-color .35s,transform .35s;min-height:92px}
.scard .num{font-size:13px;font-weight:800;color:var(--soft)}
.scard .nm{font-size:21px;font-weight:900;margin:2px 0 6px;color:var(--ink)}
.scard .st{font-size:13px;font-weight:800}
.scard.writing{background:var(--blue-l);border-color:#c8dafb}.scard.writing .st{color:var(--blue)}
.scard.done{background:var(--green-l);border-color:var(--green);animation:pop .45s}.scard.done .st{color:var(--green)}
.scard.choosing{background:var(--orange-l);border-color:#f7d2ac}.scard.choosing .st{color:var(--orange)}
.scard.voted{background:var(--purple-l);border-color:var(--purple);animation:pop .45s}.scard.voted .st{color:var(--purple)}
.scard .x{position:absolute;right:6px;top:6px;width:24px;height:24px;padding:0;border-radius:50%;background:transparent;color:#b3b9c2;font-size:15px;line-height:24px}
.scard .x:hover{background:#fff;color:var(--red)}
.scard .qt{margin-top:6px;font-size:14px;line-height:1.4;color:var(--ink);background:#fff;border-radius:10px;padding:6px 8px}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.phase-tag{font-size:14px;font-weight:800;border-radius:999px;padding:6px 12px}
.ph-q{background:var(--blue-l);color:var(--blue)}.ph-v{background:var(--purple-l);color:var(--purple)}.ph-r{background:#fff3c9;color:#9a6a00}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,45,.45);display:grid;place-items:center;z-index:80;padding:16px}
.modal{background:#fff;border-radius:22px;padding:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
/* student */
.me{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:800}
.me .badge{background:var(--navy);color:#fff;border-radius:10px;padding:4px 10px}
.qcard{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:16px;padding:14px 16px;font-size:18px;font-weight:700;line-height:1.45;color:var(--ink);margin:10px 0}
.qcard.sel{border-color:var(--purple);background:var(--purple-l);box-shadow:0 6px 18px rgba(123,92,214,.18)}
.qcard .qn{display:inline-block;font-size:13px;color:var(--soft);font-weight:800;margin-bottom:4px}
.check{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;font-weight:700;line-height:1.4;cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--purple)}
.check.on{border-color:var(--purple);background:var(--purple-l)}
.sticky-bottom{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 6px}
.big-ok{text-align:center;padding:30px 10px}
.big-ok .em{font-size:64px}
.mine{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:14px;font-size:18px;font-weight:700;line-height:1.45}
/* result stage */
.stage{min-height:calc(100vh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:20px 0}
.stage .title{font-size:44px;font-weight:900;color:var(--navy)}
.drum{font-size:90px;animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.rank-list{display:flex;flex-direction:column;gap:16px;width:100%;max-width:980px}
.rank{display:flex;gap:18px;align-items:center;background:#fff;border-radius:24px;padding:20px 24px;border:4px solid var(--line);text-align:left;animation:rise .7s cubic-bezier(.2,1.4,.4,1)}
.rank .medal{flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff}
.rank.r1{border-color:#f2b705;background:#fffbea}.rank.r1 .medal{background:linear-gradient(135deg,#ffd84d,#e8a100)}
.rank.r2{border-color:#b8c2cf}.rank.r2 .medal{background:linear-gradient(135deg,#dfe5ec,#97a3b3)}
.rank.r3{border-color:#e0a77a}.rank.r3 .medal{background:linear-gradient(135deg,#f1c39d,#c47a43)}
.rank .qs{flex:1}
.rank .qtext{font-size:28px;font-weight:900;line-height:1.35;color:var(--ink)}
.rank .crit + .qtext,.rank .who + .qtext{margin-top:14px}
.rank .who{font-size:18px;font-weight:800;color:var(--soft);margin-top:4px}
.rank .crit{font-size:16px;font-weight:700;color:#7a4a12;margin-top:8px}
.rank .votes{flex:none;text-align:center;min-width:110px}
.rank .votes b{display:block;font-size:56px;font-weight:900;color:var(--navy);line-height:1}
.rank .votes span{font-weight:800;color:var(--soft)}
@keyframes rise{0%{opacity:0;transform:translateY(40px) scale(.9)}100%{opacity:1;transform:none}}
.srank{background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;text-align:left;animation:rise .6s}
.srank .h{font-weight:900;font-size:18px;color:var(--navy)}
.srank .t{font-size:18px;font-weight:700;margin-top:6px;line-height:1.4}
table.all{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}
table.all td,table.all th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:16px}
table.all th{background:var(--gray-l);font-size:14px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.hidden{display:none!important}
</style>
</head>

  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = ev => {
    ev.stopPropagation(); const k = b.dataset.rm;
    if (confirm(`${numOf(k)}번 ${S[k].name} 학생을 지울까요?\n(잘못 들어온 경우에 쓰세요. 질문과 투표도 함께 지워져요.)`)) {
      dbPatch("rooms/" + T.code, { ["students/" + k]: null, ["votes/" + k]: null });
    }
  });
}

function editCriteria() {
  const crit = (T.room.meta.criteria || []).slice();
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal"><h2>기준 수정</h2><div id="mBox" style="margin-top:12px"></div>
    <button class="btn-ghost" id="mAdd" style="margin-top:6px">+ 기준 추가</button>
    <div class="row" style="margin-top:18px"><div class="spacer"></div><button class="btn-ghost" id="mCancel">취소</button><button class="btn-main" id="mSave">저장</button></div></div>`;
  document.body.appendChild(bg);
  const box = bg.querySelector("#mBox");
  const r = () => {
    box.innerHTML = crit.map((c, i) => `<div class="crit-edit"><input data-i="${i}" maxlength="60" value="${esc(c)}"><button data-del="${i}">✕</button></div>`).join("");
    box.querySelectorAll("input").forEach(el => el.oninput = () => { crit[+el.dataset.i] = el.value; });
    box.querySelectorAll("[data-del]").forEach(el => el.onclick = () => { crit.splice(+el.dataset.del, 1); r(); });
  };
  r();
  bg.querySelector("#mAdd").onclick = () => { if (crit.length < 6) { crit.push(""); r(); } };
  bg.querySelector("#mCancel").onclick = () => bg.remove();
  bg.querySelector("#mSave").onclick = async () => {
    const cs = crit.map(s => s.trim()).filter(Boolean);
    if (!cs.length) return toast("기준을 하나 이상 적어 주세요.");
    await dbPut("rooms/" + T.code + "/meta/criteria", cs); lsSet("qv_lastCriteria", cs); bg.remove();
  };
}

async function teacherEnd() {
  const choice = confirm("활동을 끝낼까요?\n\n[확인] 학생 이름·질문 기록을 모두 지우고 끝내기\n[취소] 계속하기");
  if (!choice) return;
  if (T.watcher) T.watcher.close();
  try { await dbDel("rooms/" + T.code); } catch (e) {}
  lsDel("qv_teacher");
  history.replaceState(null, "", location.pathname + (params.get("db") ? "?db=" + encodeURIComponent(params.get("db")) : ""));
  document.getElementById("conn").classList.add("hidden");
  toast("기록을 지우고 활동을 끝냈어요.");
  teacherSetup(null);
}

function teacherResult() {
  const room = T.room, crit = room.meta.criteria || [], res = computeResults(room);
  const reveal = room.state.reveal || 0, nR = res.ranks.length;
  const shown = res.ranks.slice(nR - reveal);  // 3위부터 아래로 공개
  const nextRank = nR - reveal; // 다음에 공개할 순위 번호
  const medal = p => p + "위";
  const rankHTML = r => `<div class="rank r${r.place}" data-place="${r.place}"><div class="medal">${medal(r.place)}</div>
      <div class="qs">${r.items.map(it => { const tc = topCrit(it, crit); return `<div class="qtext">“${nl(it.q)}”</div>${T.showNames ? `<div class="who">${it.num}번 ${esc(it.name)}</div>` : ""}${tc ? `<div class="crit">🔎 친구들이 가장 많이 꼽은 기준: ${esc(tc)}</div>` : ""}`; }).join("")}</div>
      <div class="votes"><b data-to="${r.votes}">${r.votes}</b><span>표</span></div></div>`;
  let body;
  if (!nR) {
    body = `<div class="stage"><div class="title">아직 받은 표가 없어요</div><button class="btn-ghost" id="backVote">← 투표로 돌아가기</button></div>`;
  } else if (T.showAll) {
    body = `<div style="margin-top:20px"><h2 style="margin-bottom:12px">전체 결과</h2><table class="all"><tr><th style="width:70px">표</th><th>질문</th>${T.showNames ? "<th style='width:140px'>만든 친구</th>" : ""}</tr>
      ${res.list.map(it => `<tr><td><b>${it.votes}</b></td><td>${nl(it.q)}</td>${T.showNames ? `<td>${it.num}번 ${esc(it.name)}</td>` : ""}</tr>`).join("")}</table>
      <div class="row" style="margin-top:16px"><button class="btn-ghost" id="hideAll">← 순위로 돌아가기</button></div></div>`;
  } else {
    body = `<div class="stage">
      ${reveal === 0 ? `<div class="drum" id="drum">🥁</div><div class="title">두근두근 결과 발표!</div><div class="muted" style="font-size:20px">모두 ${res.total}표가 모였어요</div>` : ""}
      <div class="rank-list" id="rankList">${shown.map(rankHTML).join("")}</div>
      <div class="row" style="justify-content:center">
        ${reveal < nR ? `<button class="btn-yellow" id="nextBtn" style="font-size:24px;padding:18px 34px">${medal(nextRank)} 공개하기</button>` : `
          <button class="btn-ghost" id="namesBtn">${T.showNames ? "🙈 만든 친구 가리기" : "👀 만든 친구 공개"}</button>
          <button class="btn-ghost" id="allBtn">📋 전체 결과 보기</button>`}
      </div></div>`;
  }
  $app.innerHTML = `<div class="twrap"><div class="row"><div class="brand"><div class="q">?</div><div>${esc(room.meta.title)}</div></div><div class="spacer"></div>
    <span class="phase-tag ph-r">3단계 · 결과 발표</span>
    <button class="btn-ghost small" id="sndBtn">${soundOn ? "🔊" : "🔇"}</button>
    <button class="btn-ghost small" id="againBtn">다시 투표</button>
    <button class="btn-ghost small" id="endBtn">끝내기</button></div>${body}</div>`;
  document.getElementById("endBtn").onclick = teacherEnd;
  document.getElementById("sndBtn").onclick = () => { soundOn = !soundOn; teacherResult(); };
  document.getElementById("againBtn").onclick = () => { if (confirm("투표 단계로 돌아갈까요? (투표는 그대로 남아 있어요)")) dbPatch("rooms/" + T.code + "/state", { phase: "vote", reveal: 0 }); };
  const bv = document.getElementById("backVote"); if (bv) bv.onclick = () => dbPatch("rooms/" + T.code + "/state", { phase: "vote", reveal: 0 });
  const nb = document.getElementById("nextBtn");
  if (nb) nb.onclick = () => {
    if (T.revealBusy) return; T.revealBusy = true; nb.disabled = true;
    const isFirst = nextRank === 1;
    nb.textContent = "두구두구두구…";
    let drum = document.getElementById("drum");
    if (!drum) { drum = document.createElement("div"); drum.className = "drum"; drum.textContent = "🥁"; document.getElementById("rankList").before(drum); }
    drumroll(isFirst ? 2.4 : 1.6);
    setTimeout(() => { T.revealBusy = false; dbPatch("rooms/" + T.code + "/state", { reveal: reveal + 1 }); }, isFirst ? 2400 : 1600);
  };
  const namesBtn = document.getElementById("namesBtn"); if (namesBtn) namesBtn.onclick = () => { T.showNames = !T.showNames; teacherResult(); };
  const allBtn = document.getElementById("allBtn"); if (allBtn) allBtn.onclick = () => { T.showAll = true; teacherResult(); };
  const hideAll = document.getElementById("hideAll"); if (hideAll) hideAll.onclick = () => { T.showAll = false; teacherResult(); };
  // 새로 공개된 순위에 효과 주기
  if (!T.showAll && T.lastReveal >= 0 && reveal > T.lastReveal) {
    const place = nR - reveal + 1;
    const el = document.querySelector(`.rank[data-place="${place}"] .votes b`);
    if (el) countUp(el, +el.dataset.to, 1200);
    if (place === 1) { fanfare(true); confetti(true); } else { fanfare(false); if (place === 2) confetti(false); }
  }
  T.lastReveal = reveal;
}

/* =========================================================
   학생 화면
   ========================================================= */
const ST = { code: params.get("r"), room: null, me: null, view: "", sel: null, selCrit: [], editing: false, joining: false };

function studentStart() {
  ST.code = ST.code.toUpperCase().replace(/[^A-Z0-9]/g, "");
  $app.innerHTML = `<div class="wrap"><p class="muted">들어가는 중…</p></div>`;
  ST.me = lsGet("qv_me_" + ST.code);
  watchRoom(ST.code, room => { ST.room = room; studentRender(); });
}

function studentRender() {
  const room = ST.room;
  if (!room || !room.meta) { ST.view = "none"; $app.innerHTML = `<div class="wrap"><div class="big-ok"><div class="em">🔍</div><h1>방을 찾을 수 없어요</h1><p class="muted" style="margin-top:8px">활동이 끝났거나 주소가 잘못됐어요.<br>선생님께 QR을 다시 받아 주세요.</p></div></div>`; return; }
  const S = room.students || {};
  // 내 정보 확인 (선생님이 지운 경우 다시 입장)
  if (ST.me && !ST.joining && Date.now() - (ST.joinedAt || 0) > 6000) {
    const s = S[key(ST.me.num)];
    if (!s || s.name !== ST.me.name) { ST.me = null; lsDel("qv_me_" + ST.code); }
  }
  if (!ST.me) return studentJoin();
  const ph = room.state.phase, mine = S[key(ST.me.num)] || {};
  if (ST.lastPhase !== ph) { ST.lastPhase = ph; ST.editing = false; ST.sel = null; ST.selCrit = []; }
  const myVote = (room.votes || {})[key(ST.me.num)];
  let view;
  if (ph === "question") view = (mine.q && !ST.editing) ? "qdone" : "qedit";
  else if (ph === "vote") view = myVote && !ST.editing ? "vdone" : "vsel";
  else view = "result";
  const qsig = ph === "vote" ? Object.keys(S).filter(k => S[k].q).sort().join(",") : "";
  const viewKey = view + "|" + (view === "qdone" ? mine.q : "") + "|" + qsig + "|" + (view === "vdone" ? JSON.stringify(myVote) : "") + "|" + (view === "result" ? room.state.reveal : "") + "|" + (room.meta.criteria || []).join("/") + "|" + room.meta.title;
  if (viewKey === ST.view) return;
  ST.view = viewKey;
  const head = `<div class="me"><span class="badge">${ST.me.num}번</span><span>${esc(ST.me.name)}</span><div class="spacer"></div><span class="muted small">${esc(room.meta.title)}</span></div>`;
  const critList = `<ol class="crit-list">${(room.meta.criteria || []).map((c, i) => `<li><b>${i + 1}</b><span>${esc(c)}</span></li>`).join("")}</ol>`;

  if (view === "qedit") {
    const prev = document.getElementById("qInput") ? document.getElementById("qInput").value : (mine.q || "");
    $app.innerHTML = `<div class="wrap">${head}
      <h1 style="margin:22px 0 8px">✏️ 나의 질문 만들기</h1>
      <p class="muted">작품을 읽고 떠오른 질문을 하나 써 주세요.</p>
      <label class="field"><textarea id="qInput" rows="4" maxlength="150" placeholder="예) 주인공은 왜 그런 선택을 했을까?"></textarea></label>
      <div class="muted small" style="text-align:right;margin-top:-8px" id="qLen"></div>
      <button class="btn-main" id="qSend" style="width:100%;font-size:19px;padding:16px;margin-top:10px">질문 보내기</button>
      ${mine.q ? `<button class="btn-ghost" id="qCancel" style="width:100%;margin-top:8px">취소</button>` : ""}
      <details style="margin-top:22px"><summary class="muted small" style="cursor:pointer">좋은 질문의 기준 미리 보기</summary><div style="margin-top:10px">${critList}</div></details>
    </div>`;
    const ta = document.getElementById("qInput"), len = document.getElementById("qLen");
    ta.value = prev; const upd = () => len.textContent = ta.value.length + " / 150"; upd(); ta.oninput = upd;
    document.getElementById("qSend").onclick = async ev => {
      const q = ta.value.trim();
      if (q.length < 4) return toast("질문을 조금 더 자세히 써 주세요.");
      ev.target.disabled = true;
      try { await dbPatch("rooms/" + ST.code + "/students/" + key(ST.me.num), { q, qt: Date.now() }); ST.editing = false;
        const me = (ST.room.students || {})[key(ST.me.num)]; if (me) me.q = q; ST.view = ""; studentRender(); }
      catch (e) { ev.target.disabled = false; }
    };
    const qc = document.getElementById("qCancel"); if (qc) qc.onclick = () => { ST.editing = false; ST.view = ""; studentRender(); };
  } else if (view === "qdone") {
    $app.innerHTML = `<div class="wrap">${head}
      <div class="big-ok"><div class="em">✅</div><h1>질문을 보냈어요!</h1><p class="muted" style="margin-top:6px">친구들이 다 쓰면 선생님이 투표를 시작해요.</p></div>
      <div class="mine">${nl(mine.q)}</div>
      <button class="btn-ghost" id="qEdit" style="width:100%;margin-top:12px">질문 고치기</button></div>`;
    document.getElementById("qEdit").onclick = () => { ST.editing = true; ST.view = ""; studentRender(); };
  } else if (view === "vsel") {
    const myK = key(ST.me.num);
    const rnd = seeded(hash(ST.code + ST.me.num));
    const list = Object.keys(S).filter(k => S[k].q && k !== myK).map(k => ({ k, q: S[k].q, r: rnd() })).sort((a, b) => a.r - b.r);
    if (myVote && ST.sel === null) { ST.sel = myVote.to; ST.selCrit = (myVote.c || []).slice(); }
    if (ST.sel && !list.find(x => x.k === ST.sel)) { ST.sel = null; ST.selCrit = []; }
    const crit = room.meta.criteria || [];
    $app.innerHTML = `<div class="wrap">${head}
      <h1 style="margin:22px 0 8px">🔎 좋은 질문 고르기</h1>
      <div class="panel" style="padding:14px"><div style="font-weight:800;color:var(--navy);margin-bottom:8px">이 기준으로 골라요</div>${critList}</div>
      <p class="muted small" style="margin:14px 0 2px">친구 이름은 보이지 않아요. 내 질문은 목록에 없어요. 질문 내용만 보고 골라 주세요.</p>
      <div id="qList">${list.length ? list.map((x, i) => `<button class="qcard${ST.sel === x.k ? " sel" : ""}" data-k="${x.k}"><span class="qn">질문 ${i + 1}</span><br>${nl(x.q)}</button>`).join("") : `<p class="muted">고를 질문이 아직 없어요.</p>`}</div>
      <div id="critPick" class="${ST.sel ? "" : "hidden"}" style="margin-top:18px">
        <h2>이 질문은 어떤 기준에 맞나요?</h2><p class="muted small" style="margin:4px 0 6px">맞는 것을 모두 골라 주세요. (1개 이상)</p>
        ${crit.map((c, i) => `<label class="check${ST.selCrit.includes(i) ? " on" : ""}"><input type="checkbox" data-ci="${i}" ${ST.selCrit.includes(i) ? "checked" : ""}><span>${esc(c)}</span></label>`).join("")}
      </div>
      <div class="sticky-bottom"><button class="btn-main" id="voteBtn" style="width:100%;font-size:19px;padding:16px">투표하기</button>
      ${myVote ? `<button class="btn-ghost" id="vCancel" style="width:100%;margin-top:8px">취소</button>` : ""}</div></div>`;
    const updBtn = () => {
      const b = document.getElementById("voteBtn"), ok = ST.sel && ST.selCrit.length;
      b.disabled = !ok; b.textContent = !ST.sel ? "질문을 하나 골라 주세요" : !ST.selCrit.length ? "기준을 체크해 주세요" : "투표하기";
    };
    updBtn();
    document.querySelectorAll(".qcard").forEach(b => b.onclick = () => {
      ST.sel = b.dataset.k;
      document.querySelectorAll(".qcard").forEach(x => x.classList.toggle("sel", x === b));
      const cp = document.getElementById("critPick"); const wasHidden = cp.classList.contains("hidden"); cp.classList.remove("hidden");
      if (wasHidden) setTimeout(() => cp.scrollIntoView({ behavior: "smooth", block: "center" }), 60);
      updBtn();
    });
    document.querySelectorAll("[data-ci]").forEach(cb => cb.onchange = () => {
      const i = +cb.dataset.ci;
      ST.selCrit = cb.checked ? [...new Set([...ST.selCrit, i])].sort() : ST.selCrit.filter(x => x !== i);
      cb.closest(".check").classList.toggle("on", cb.checked); updBtn();
    });
    document.getElementById("voteBtn").onclick = async ev => {
      if (!ST.sel || !ST.selCrit.length) return;
      ev.target.disabled = true;
      try { const v = { to: ST.sel, c: ST.selCrit, t: Date.now() }; await dbPut("rooms/" + ST.code + "/votes/" + myK, v); ST.editing = false;
        ST.room.votes = ST.room.votes || {}; ST.room.votes[myK] = v; ST.view = ""; studentRender(); }
      catch (e) { ev.target.disabled = false; }
    };
    const vc = document.getElementById("vCancel"); if (vc) vc.onclick = () => { ST.editing = false; ST.view = ""; studentRender(); };
  } else if (view === "vdone") {
    const q = (S[myVote.to] || {}).q || "(지워진 질문)";
    const crit = room.meta.criteria || [];
    $app.innerHTML = `<div class="wrap">${head}
      <div class="big-ok"><div class="em">🗳️</div><h1>투표했어요!</h1><p class="muted" style="margin-top:6px">선생님이 결과를 발표할 때까지 기다려 주세요.</p></div>
      <div class="muted small" style="margin-bottom:6px">내가 고른 질문</div>
      <div class="mine">${nl(q)}</div>
      <div class="muted small" style="margin:12px 0 6px">내가 체크한 기준</div>
      <ol class="crit-list">${(myVote.c || []).map(i => `<li><b>${i + 1}</b><span>${esc(crit[i] || "")}</span></li>`).join("")}</ol>
      <button class="btn-ghost" id="vEdit" style="width:100%;margin-top:14px">다시 고르기</button></div>`;
    document.getElementById("vEdit").onclick = () => { ST.editing = true; ST.sel = null; ST.view = ""; studentRender(); };
  } else {
    const res = computeResults(room), reveal = room.state.reveal || 0, nR = res.ranks.length;
    const shown = res.ranks.slice(nR - reveal);
    $app.innerHTML = `<div class="wrap">${head}
      <div class="big-ok"><div class="em">${reveal >= nR && nR ? "🎉" : "🥁"}</div><h1>${reveal >= nR && nR ? "결과 발표 끝!" : "결과 발표 중!"}</h1><p class="muted" style="margin-top:6px">선생님 화면을 봐 주세요 👀</p></div>
      <div style="display:flex;flex-direction:column">${shown.map(r => `<div class="srank"><div class="h">${r.place}위 · ${r.votes}표</div>${r.items.map(it => `<div class="t">“${nl(it.q)}”</div>`).join("")}</div>`).join("")}</div></div>`;
  }
}

function studentJoin() {
  if (ST.view === "join") return;
  ST.view = "join";
  const room = ST.room;
  $app.innerHTML = `<div class="wrap">
    <div class="brand"><div class="q">?</div><div>좋은 질문 찾기</div></div>
    <h1 style="margin:20px 0 4px">${esc(room.meta.title)}</h1>
    <p class="muted">번호와 이름을 적고 들어오세요.</p>
    <div class="panel" style="margin-top:16px">
      <label class="field"><span>번호</span><input id="jNum" type="number" inputmode="numeric" min="1" max="99" placeholder="예) 7"></label>
      <label class="field"><span>이름</span><input id="jName" maxlength="10" placeholder="예) 김하늘" autocomplete="off"></label>
      <button class="btn-main" id="jGo" style="width:100%;font-size:19px;padding:16px;margin-top:4px">들어가기</button>
    </div></div>`;
  const go = async () => {
    const num = parseInt(document.getElementById("jNum").value, 10), name = document.getElementById("jName").value.trim();
    if (!num || num < 1 || num > 99) return toast("번호를 바르게 적어 주세요.");
    if (!name) return toast("이름을 적어 주세요.");
    const btn = document.getElementById("jGo"); btn.disabled = true; ST.joining = true;
    try {
      const ex = await dbGet("rooms/" + ST.code + "/students/" + key(num));
      if (ex && ex.name !== name) { toast(`${num}번은 이미 다른 이름으로 들어와 있어요. 선생님께 말해 주세요.`, 3500); btn.disabled = false; ST.joining = false; return; }
      if (!ex) await dbPut("rooms/" + ST.code + "/students/" + key(num), { name, t: Date.now() });
      ST.me = { num, name }; lsSet("qv_me_" + ST.code, ST.me); ST.joinedAt = Date.now();
      ST.room.students = ST.room.students || {}; if (!ST.room.students[key(num)]) ST.room.students[key(num)] = { name };
      ST.joining = false; ST.view = ""; studentRender();
    } catch (e) { btn.disabled = false; ST.joining = false; }
  };
  document.getElementById("jGo").onclick = go;
  document.getElementById("jName").onkeydown = e => { if (e.key === "Enter") go(); };
}

/* ====== 시작 ====== */
if (DB.indexOf("__DB_URL") === 0) {
  $app.innerHTML = `<div class="wrap"><h1>설정이 필요해요</h1><p class="muted">데이터베이스 주소가 아직 연결되지 않았어요.</p></div>`;
} else if (ROLE === "student") studentStart(); else teacherStart();
</script>
